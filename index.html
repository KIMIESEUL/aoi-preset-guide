<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOI 3D Presetting Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f5f6f8;--panel:#ffffff;--border:#e8eaed;--border-light:#f0f1f3;
  --text:#16171a;--text2:#5f6368;--text3:#9aa0a6;
  --blue:#1a73e8;--blue-soft:#e8f0fe;--blue-mid:#4285f4;--blue-dark:#1557b0;
  --amber:#ea8600;--amber-soft:#fef7e0;--amber-border:#fdd663;--amber-dark:#b06000;
  --red:#d93025;--red-soft:#fce8e6;--red-border:#f28b82;--red-dark:#a50e0e;
  --green:#1e8e3e;--green-soft:#e6f4ea;--green-border:#81c995;--green-dark:#137333;
  --purple:#7b1fa2;--purple-soft:#f3e8fd;
  --shadow-xs:0 1px 2px rgba(60,64,67,.1);
  --shadow-sm:0 1px 3px rgba(60,64,67,.15),0 1px 2px rgba(60,64,67,.1);
  --shadow-md:0 2px 6px rgba(60,64,67,.15),0 1px 3px rgba(60,64,67,.1);
  --shadow-lg:0 4px 12px rgba(60,64,67,.15),0 2px 4px rgba(60,64,67,.08);
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
}
body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;}
.app{display:flex;height:100vh;}

/* ═══ 사이드바 ═══ */
.sidebar{width:296px;min-width:280px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.sb-head{padding:20px 20px 16px;border-bottom:1px solid var(--border);}
.sb-head h2{font-size:14px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:10px;color:var(--text);}
.sb-logo{width:32px;height:32px;background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(26,115,232,.3);}
.sb-logo svg{width:18px;height:18px;fill:#fff;}
.sel-badge{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:10px;padding:2px 10px;margin-left:auto;}

.part-row{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);}
.part-row label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
.part-select{flex:1;height:32px;border:1.5px solid var(--border);border-radius:var(--radius-xs);background:#fff;font-size:12px;font-family:inherit;color:var(--text);padding:0 10px;cursor:pointer;outline:none;transition:border .15s;}
.part-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,115,232,.12);}

.sym-scroll{flex:1;overflow-y:auto;padding:8px 12px;}
.sym-scroll::-webkit-scrollbar{width:3px;}
.sym-scroll::-webkit-scrollbar-thumb{background:#dadce0;border-radius:2px;}
.cat-group{margin-bottom:2px;}
.cat-label{font-size:10px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.8px;padding:8px 8px 4px;}
.sym-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--radius-xs);cursor:pointer;transition:background .1s;}
.sym-row:hover{background:var(--blue-soft);}
.sym-row input{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;margin:0;flex-shrink:0;}
.sym-row span{font-size:12px;line-height:1.35;user-select:none;color:var(--text);}

.sb-foot{padding:8px 20px 14px;border-top:1px solid var(--border);}
.btn-clear{width:100%;background:#f8f9fa;color:var(--text2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:7px 0;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .12s;}
.btn-clear:hover{background:#e8eaed;border-color:#dadce0;color:var(--text);}

/* ═══ 메인 ═══ */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.tab-bar{display:flex;align-items:center;padding:0 24px;height:52px;border-bottom:1px solid var(--border);background:var(--panel);gap:2px;}
.tab-btn{padding:8px 20px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;border-radius:var(--radius-sm);background:transparent;color:var(--text3);transition:all .15s;position:relative;}
.tab-btn.active{background:var(--blue);color:#fff;box-shadow:0 1px 4px rgba(26,115,232,.3);}
.tab-btn:not(.active):hover{background:#f1f3f4;color:var(--text2);}
.res-badge{margin-left:auto;font-size:11px;color:var(--text3);font-weight:500;}

.content{flex:1;overflow-y:auto;padding:20px 24px;background:var(--bg);}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:#dadce0;border-radius:2px;}

.empty-state{text-align:center;padding:100px 0;color:var(--text3);}
.empty-state svg{margin-bottom:16px;opacity:.35;}
.empty-state p{font-size:14px;line-height:1.7;}
.empty-state strong{color:var(--text2);}

/* ═══ 플로우 카드 ═══ */
.fc{background:var(--panel);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:20px;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .2s;}
.fc:hover{box-shadow:var(--shadow-md);}

/* 헤더 */
.fc-h{display:flex;align-items:center;padding:18px 24px;gap:14px;border-bottom:1px solid var(--border-light);background:#fafbfc;}
.fc-ico{width:44px;height:44px;border-radius:var(--radius);background:linear-gradient(135deg,var(--blue) 0%,#5e97f6 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(26,115,232,.25);}
.fc-ico svg{width:22px;height:22px;fill:#fff;}
.fc-info{flex:1;min-width:0;}
.fc-info h3{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:3px;}
.fc-info p{font-size:12px;color:var(--text2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.fc-dots{display:flex;gap:5px;flex-shrink:0;}
.fc-dot{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 -1px 2px rgba(0,0,0,.15);}
.fc-dot.db{background:linear-gradient(135deg,var(--blue-mid),var(--blue));}
.fc-dot.da{background:linear-gradient(135deg,#f9ab00,var(--amber));}
.fc-dot.dr{background:linear-gradient(135deg,#ea4335,var(--red));}

/* ═══ 타임라인 ═══ */
.fc-body{padding:20px 24px 16px;}
.tl{position:relative;padding-left:56px;}

/* 레일 */
.tl::before{content:'';position:absolute;left:20px;top:8px;bottom:8px;width:3px;border-radius:2px;background:linear-gradient(180deg,var(--blue) 0%,var(--amber) 55%,var(--red) 100%);}

/* ─── 스텝 그룹 ─── */
.tl-step{position:relative;margin-bottom:6px;}
.tl-step:last-child{margin-bottom:0;}

/* 원형 노드 */
.tl-num{position:absolute;left:-56px;top:0;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;z-index:2;}
.tl-num.nb{background:linear-gradient(135deg,var(--blue-mid),var(--blue));box-shadow:0 3px 10px rgba(26,115,232,.3);}
.tl-num.na{background:linear-gradient(135deg,#f9ab00,var(--amber));box-shadow:0 3px 10px rgba(234,134,0,.3);}
.tl-num.nr{background:linear-gradient(135deg,#ea4335,var(--red));box-shadow:0 3px 10px rgba(217,48,37,.3);}

/* 스텝 카드 */
.sc{border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--border);background:#fff;transition:all .15s;}
.sc.sb{border-color:#c6dafc;} .sc.sb:hover{border-color:var(--blue-mid);box-shadow:0 2px 8px rgba(26,115,232,.1);}
.sc.sa{border-color:var(--amber-border);} .sc.sa:hover{border-color:var(--amber);box-shadow:0 2px 8px rgba(234,134,0,.1);}
.sc.sr{border-color:var(--red-border);} .sc.sr:hover{border-color:var(--red);box-shadow:0 2px 8px rgba(217,48,37,.1);}

.sc-h{display:flex;align-items:center;padding:12px 16px;gap:10px;cursor:pointer;user-select:none;transition:background .1s;}
.sc-h:hover{background:#fafbfd;}
.sc-tag{font-size:10px;font-weight:800;color:#fff;border-radius:5px;padding:3px 10px;letter-spacing:.3px;white-space:nowrap;}
.sb .sc-tag{background:var(--blue);} .sa .sc-tag{background:var(--amber);} .sr .sc-tag{background:var(--red);}
.sc-name{font-size:13px;font-weight:700;flex:1;}
.sb .sc-name{color:var(--blue-dark);} .sa .sc-name{color:var(--amber-dark);} .sr .sc-name{color:var(--red-dark);}
.sc-cnt{font-size:11px;color:var(--text3);font-weight:500;}
.sc-arr{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#f1f3f4;transition:all .2s;flex-shrink:0;}
.sc-arr svg{width:10px;height:10px;fill:var(--text3);transition:transform .2s;}
.sc-arr.open{background:var(--blue-soft);} .sc-arr.open svg{transform:rotate(180deg);fill:var(--blue);}

/* 파라미터 (접히는 부분) */
.sc-det{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1);}
.sc-det.open{max-height:800px;}
.sc-params{padding:2px 16px 14px;border-top:1px solid var(--border-light);}

.pm{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5;}
.pm:last-child{border-bottom:none;}
.pm-dir{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:800;margin-top:1px;}
.pm-dir.up{background:#e6f4ea;color:var(--green);}
.pm-dir.dn{background:var(--red-soft);color:var(--red);}
.pm-dir.ch{background:var(--blue-soft);color:var(--blue);}
.pm-dir.on{background:#e6f4ea;color:var(--green);font-size:8px;font-weight:800;}
.pm-tag{font-size:11px;font-weight:700;color:var(--blue-dark);background:var(--blue-soft);padding:3px 10px;border-radius:5px;white-space:nowrap;flex-shrink:0;}
.pm-body{flex:1;min-width:0;}
.pm-act{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.4;}
.pm-why{font-size:11px;color:var(--text3);line-height:1.4;margin-top:2px;}

/* ─── 확인 포인트 ─── */
.tl-chk{position:relative;margin-bottom:6px;}
.tl-chk .tl-num{width:30px;height:30px;left:-50px;top:2px;margin-left:0px;}
.tl-chk .tl-num.ng{background:linear-gradient(135deg,#34a853,var(--green));box-shadow:0 2px 8px rgba(30,142,62,.25);}

.chk{display:flex;align-items:center;gap:10px;background:var(--green-soft);border:1.5px solid var(--green-border);border-radius:var(--radius);padding:10px 16px;}
.chk-ico{width:22px;height:22px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 4px rgba(30,142,62,.2);}
.chk-ico svg{width:12px;height:12px;fill:#fff;}
.chk-txt{font-size:12px;color:var(--green-dark);font-weight:600;line-height:1.4;flex:1;}
.chk-br{display:flex;gap:5px;flex-shrink:0;}
.br-ok,.br-no{font-size:10px;font-weight:700;border-radius:5px;padding:3px 10px;white-space:nowrap;}
.br-ok{color:#fff;background:var(--green);box-shadow:0 1px 3px rgba(30,142,62,.2);}
.br-no{color:#fff;background:var(--amber);box-shadow:0 1px 3px rgba(234,134,0,.2);}

/* 완료 */
.tl-end{position:relative;}
.tl-end .tl-num{width:34px;height:34px;left:-52px;top:0;margin-left:-1px;}
.end-c{background:linear-gradient(135deg,#e6f4ea,#ceead6);border:2px solid var(--green-border);border-radius:var(--radius);padding:10px 18px;display:flex;align-items:center;gap:8px;}
.end-c svg{width:16px;height:16px;fill:var(--green-dark);}
.end-c span{font-size:13px;font-weight:700;color:var(--green-dark);}

/* ─── CRM / 주의 ─── */
.fc-ext{display:flex;gap:12px;padding:0 24px 18px;flex-wrap:wrap;}
.ext{flex:1;min-width:220px;border-radius:var(--radius);padding:0;overflow:hidden;}
.ext.crm{background:var(--green-soft);border:1px solid var(--green-border);}
.ext.wrn{background:#fef7e0;border:1px solid var(--amber-border);}

.ext-h{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none;}
.ext-h .ext-ico{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.crm .ext-ico{background:var(--green);} .wrn .ext-ico{background:var(--amber);}
.ext-ico svg{width:10px;height:10px;fill:#fff;}
.ext-h .ext-title{font-size:11px;font-weight:700;flex:1;}
.crm .ext-title{color:var(--green-dark);} .wrn .ext-title{color:var(--amber-dark);}
.ext-h .ext-arr{font-size:11px;transition:transform .2s;}
.crm .ext-arr{color:var(--green-dark);} .wrn .ext-arr{color:var(--amber-dark);}
.ext-arr.open{transform:rotate(180deg);}

.ext-b{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.ext-b.open{max-height:300px;}
.ext-b-inner{padding:0 14px 10px;}
.ext-item{font-size:11.5px;line-height:1.5;padding:3px 0;}
.crm .ext-item{color:var(--green-dark);} .wrn .ext-item{color:var(--amber-dark);}

/* ═══ 파라미터 사전 ═══ */
.dc{margin-bottom:16px;}
.dc-title{font-size:13px;font-weight:800;color:var(--blue);padding:8px 0 6px;border-bottom:2px solid var(--blue-soft);margin-bottom:6px;letter-spacing:-.2px;}
.dc-card{background:var(--panel);border-radius:var(--radius-sm);border:1px solid var(--border);margin:4px 0;overflow:hidden;box-shadow:var(--shadow-xs);}
.dc-h{display:flex;align-items:center;padding:10px 16px;cursor:pointer;user-select:none;gap:10px;transition:background .1s;}
.dc-h:hover{background:#f8f9fa;}
.dc-h h4{font-size:13px;font-weight:700;flex:1;}
.dc-h .dc-desc{font-size:11px;color:var(--text3);text-align:right;}
.dc-h .dc-arr{font-size:11px;color:var(--text3);transition:transform .2s;flex-shrink:0;}
.dc-arr.open{transform:rotate(180deg);}
.dc-det{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.dc-det.open{max-height:500px;}
.dc-opts{padding:4px 16px 10px;border-top:1px solid var(--border-light);}
.dc-opt{display:flex;padding:5px 0;gap:12px;border-bottom:1px solid #f5f5f5;}
.dc-opt:last-child{border-bottom:none;}
.dc-opt .do-n{min-width:180px;width:180px;font-size:12px;font-weight:600;color:var(--blue);flex-shrink:0;}
.dc-opt .do-d{font-size:12px;color:var(--text2);line-height:1.4;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sb-head">
      <h2>
        <span class="sb-logo"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></span>
        AOI Presetting Guide
        <span class="sel-badge" id="selCount" style="display:none"></span>
      </h2>
    </div>
    <div class="part-row">
      <label>부품 타입</label>
      <select class="part-select" id="partSelect"></select>
    </div>
    <div class="sym-scroll" id="symptomArea"></div>
    <div class="sb-foot"><button class="btn-clear" id="btnClear">전체 해제</button></div>
  </div>
  <div class="main-area">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="trouble">트러블슈팅</button>
      <button class="tab-btn" data-tab="dict">파라미터 사전</button>
      <span class="res-badge" id="resultCount"></span>
    </div>
    <div class="content" id="tabT">
      <div id="resArea">
        <div class="empty-state">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#bcc1c6" stroke-width="1.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          <p>좌측에서 <strong>증상을 선택</strong>하면<br>단계별 트러블슈팅 가이드가 표시됩니다</p>
        </div>
      </div>
    </div>
    <div class="content" id="tabD" style="display:none;"></div>
  </div>
</div>

<script>

    h+='<div class="fc-ext">';
    if(g.crm&&g.crm.length){h+='<div class="ext crm"><div class="ext-h" onclick="tglE(this)"><span class="ext-ico">'+ICK+'</span><span class="ext-title">CRM 실적 ('+g.crm.length+')</span><span class="ext-arr">&#x25BC;</span></div><div class="ext-b"><div class="ext-b-inner">';g.crm.forEach(function(c){h+='<div class="ext-item">&#x2022; '+esc(c)+'</div>';});h+='</div></div></div>';}
    if(g.warn&&g.warn.length){h+='<div class="ext wrn"><div class="ext-h" onclick="tglE(this)"><span class="ext-ico"><svg viewBox="0 0 16 16"><path d="M8 1L1 14h14L8 1z" fill="#fff"/></svg></span><span class="ext-title">주의사항 ('+g.warn.length+')</span><span class="ext-arr">&#x25BC;</span></div><div class="ext-b"><div class="ext-b-inner">';g.warn.forEach(function(w){h+='<div class="ext-item">&#x26A0; '+esc(w)+'</div>';});h+='</div></div></div>';}
    h+='</div>';
  }
  el.innerHTML=h;return el;
}

function tgl(el){var d=el.nextElementSibling,a=el.querySelector('.sc-arr');d.classList.toggle('open');a.classList.toggle('open');}
function tglE(el){var b=el.nextElementSibling,a=el.querySelector('.ext-arr');b.classList.toggle('open');a.classList.toggle('open');}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

/* 파라미터 사전 */
(function(){
  var h='';PG.forEach(function(cat){h+='<div class="dc"><div class="dc-title">'+esc(cat[0])+'</div>';cat[1].forEach(function(p){var desc=PGD[p[0]]||'';h+='<div class="dc-card"><div class="dc-h" onclick="tglD(this)"><h4>'+esc(p[0])+'</h4><span class="dc-desc">'+esc(desc)+'</span><span class="dc-arr">&#x25BC;</span></div><div class="dc-det"><div class="dc-opts">';p[1].forEach(function(o){h+='<div class="dc-opt"><span class="do-n">'+esc(o[0])+'</span><span class="do-d">'+esc(o[1])+'</span></div>';});h+='</div></div></div>';});h+='</div>';});tabD.innerHTML=h;
})();
function tglD(el){var d=el.nextElementSibling,a=el.querySelector('.dc-arr');d.classList.toggle('open');a.classList.toggle('open');}
</script>
