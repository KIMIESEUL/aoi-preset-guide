<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOI 3D Presetting Guide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f8f9fb;--panel:#fff;--border:#e5e7eb;--divider:#f0f0f0;
  --text:#1a1a2e;--text2:#5a5a7a;--text3:#8a8aa0;
  --accent:#4f6ef7;--accent-light:#eef1fe;--accent-dark:#3b54c4;
  --blue:#4f6ef7;--blue-bg:#eef1fe;--blue-border:#c7d2fe;
  --amber:#e5960a;--amber-bg:#fef9ec;--amber-border:#fde68a;
  --red:#e5393a;--red-bg:#fef2f2;--red-border:#fecaca;
  --green:#10b981;--green-bg:#ecfdf5;--green-border:#a7f3d0;--green-dark:#059669;
  --crm-bg:#f0fdf4;--crm-border:#86efac;--crm-text:#15803d;
  --warn-bg:#fffbeb;--warn-border:#fcd34d;--warn-text:#92400e;
  --param-bg:#eef1fe;--param-text:#4338ca;
  --rail-w:4px;--node-size:36px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
  --shadow-lg:0 8px 30px rgba(0,0,0,.12);
}
body{font-family:-apple-system,'Segoe UI','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:14px;}
.app{display:flex;height:100vh;gap:0;}

/* ───── 좌측 패널 ───── */
.sidebar{width:300px;min-width:280px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.sidebar-head{padding:16px 20px 12px;border-bottom:1px solid var(--border);}
.sidebar-head h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
.sidebar-head h2 .logo{width:28px;height:28px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;}
.sidebar-head h2 .logo svg{width:16px;height:16px;fill:#fff;}
.sel-badge{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-light);border-radius:10px;padding:2px 8px;margin-left:auto;}
.part-row{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--border);}
.part-row label{font-size:12px;font-weight:700;white-space:nowrap;color:var(--text2);}
.part-select{flex:1;height:30px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12px;font-family:inherit;color:var(--text);padding:0 10px;cursor:pointer;outline:none;}
.part-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.15);}
.sym-scroll{flex:1;overflow-y:auto;padding:8px 12px;}
.sym-scroll::-webkit-scrollbar{width:4px;}
.sym-scroll::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px;}
.cat-group{margin-bottom:4px;}
.cat-label{font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:0.8px;padding:6px 8px 3px;}
.sym-row{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px;cursor:pointer;transition:background .12s;}
.sym-row:hover{background:var(--accent-light);}
.sym-row input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0;flex-shrink:0;}
.sym-row span{font-size:12.5px;line-height:1.3;user-select:none;}
.sidebar-foot{padding:8px 20px 12px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;}
.btn-clear{background:#f3f4f6;color:var(--text2);border:1px solid var(--border);border-radius:8px;padding:6px 16px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .12s;}
.btn-clear:hover{background:#e5e7eb;color:var(--text);}

/* ───── 우측 메인 ───── */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.tab-bar{display:flex;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel);gap:4px;}
.tab-btn{padding:7px 20px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;border-radius:8px;background:transparent;color:var(--text3);transition:all .15s;}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(79,110,247,.25);}
.tab-btn:not(.active):hover{background:#f3f4f6;color:var(--text);}
.result-badge{margin-left:auto;font-size:11px;color:var(--text3);font-weight:500;}
.content{flex:1;overflow-y:auto;padding:16px 20px;background:var(--bg);}
.content::-webkit-scrollbar{width:5px;}
.content::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px;}
.empty-state{text-align:center;padding:80px 0;color:var(--text3);}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:.4;}
.empty-state p{font-size:15px;line-height:1.6;}

/* ───── 플로우 카드 ───── */
.flow-card{background:var(--panel);border-radius:16px;border:1px solid var(--border);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .2s;}
.flow-card:hover{box-shadow:var(--shadow-md);}

/* 헤더 */
.fc-header{display:flex;align-items:center;padding:16px 20px;gap:12px;background:linear-gradient(135deg,#fafaff 0%,#f5f7ff 100%);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
.fc-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(79,110,247,.3);}
.fc-icon svg{width:20px;height:20px;fill:#fff;}
.fc-title{flex:1;}
.fc-title h3{font-size:16px;font-weight:700;margin-bottom:2px;}
.fc-title .fc-cause{font-size:12px;color:var(--text2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.fc-steps-count{display:flex;gap:4px;flex-shrink:0;}
.fc-step-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--border);}
.fc-step-dot.d1{border-color:var(--blue);background:var(--blue);}
.fc-step-dot.d2{border-color:var(--amber);background:var(--amber);}
.fc-step-dot.d3{border-color:var(--red);background:var(--red);}

/* ───── 타임라인 ───── */
.fc-body{padding:0 20px 16px;}

.timeline{position:relative;padding-left:48px;margin-top:16px;}

/* 세로 레일 */
.timeline::before{content:'';position:absolute;left:17px;top:0;bottom:0;width:var(--rail-w);background:linear-gradient(to bottom,var(--blue) 0%,var(--amber) 50%,var(--red) 100%);border-radius:2px;}

/* 타임라인 노드 (원) */
.tl-node{position:relative;margin-bottom:8px;}
.tl-node:last-child{margin-bottom:0;}

.tl-circle{position:absolute;left:-48px;width:var(--node-size);height:var(--node-size);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.tl-circle.c-blue{background:linear-gradient(135deg,#6366f1,var(--blue));}
.tl-circle.c-amber{background:linear-gradient(135deg,#f59e0b,var(--amber));}
.tl-circle.c-red{background:linear-gradient(135deg,#ef4444,var(--red));}
.tl-circle.c-green{background:linear-gradient(135deg,#34d399,var(--green));}

/* 스텝 카드 */
.step-card{border-radius:12px;border:2px solid var(--border);overflow:hidden;background:#fff;transition:border-color .2s,box-shadow .2s;}
.step-card.sc-blue{border-color:var(--blue-border);}
.step-card.sc-blue:hover{box-shadow:0 2px 12px rgba(79,110,247,.12);}
.step-card.sc-amber{border-color:var(--amber-border);}
.step-card.sc-amber:hover{box-shadow:0 2px 12px rgba(229,150,10,.12);}
.step-card.sc-red{border-color:var(--red-border);}
.step-card.sc-red:hover{box-shadow:0 2px 12px rgba(229,57,58,.12);}

.sc-head{display:flex;align-items:center;padding:10px 14px;gap:8px;cursor:pointer;user-select:none;transition:background .12s;}
.sc-head:hover{background:#fafbff;}
.sc-badge{font-size:10px;font-weight:800;color:#fff;border-radius:6px;padding:3px 10px;letter-spacing:.5px;white-space:nowrap;}
.sc-blue .sc-badge{background:var(--blue);}
.sc-amber .sc-badge{background:var(--amber);}
.sc-red .sc-badge{background:var(--red);}
.sc-label{font-size:13px;font-weight:700;flex:1;}
.sc-blue .sc-label{color:var(--blue);}
.sc-amber .sc-label{color:var(--amber);}
.sc-red .sc-label{color:var(--red);}
.sc-count{font-size:11px;color:var(--text3);font-weight:500;}
.sc-arrow{font-size:14px;color:var(--text3);transition:transform .2s;flex-shrink:0;}
.sc-arrow.open{transform:rotate(180deg);}

/* 파라미터 리스트 (접히는 영역) */
.sc-detail{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.sc-detail.open{max-height:600px;}
.sc-params{padding:0 14px 12px;}

.pm-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--divider);}
.pm-row:last-child{border-bottom:none;}
.pm-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--param-text);background:var(--param-bg);padding:3px 10px;border-radius:6px;white-space:nowrap;flex-shrink:0;}
.pm-dir{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;font-size:12px;font-weight:800;flex-shrink:0;}
.pm-dir.up{background:#dcfce7;color:#16a34a;}
.pm-dir.down{background:#fee2e2;color:#dc2626;}
.pm-dir.change{background:#e0e7ff;color:#4338ca;}
.pm-dir.on{background:#dcfce7;color:#16a34a;}
.pm-body{flex:1;min-width:0;}
.pm-action{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.4;}
.pm-why{font-size:11.5px;color:var(--text2);line-height:1.4;margin-top:2px;opacity:.85;}

/* 확인 포인트 */
.tl-check{position:relative;margin-bottom:8px;}
.tl-check .tl-circle{width:28px;height:28px;left:-44px;margin-left:4px;font-size:14px;}
.check-card{background:var(--green-bg);border:1.5px solid var(--green-border);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:8px;}
.check-card .chk-icon{width:20px;height:20px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.check-card .chk-icon svg{width:12px;height:12px;fill:#fff;}
.check-card .chk-text{font-size:12px;color:var(--green-dark);font-weight:600;line-height:1.4;flex:1;}
.check-card .chk-branch{display:flex;gap:6px;flex-shrink:0;margin-left:8px;}
.chk-yes,.chk-no{font-size:10px;font-weight:700;border-radius:5px;padding:2px 8px;white-space:nowrap;}
.chk-yes{color:var(--green-dark);background:#d1fae5;border:1px solid var(--green-border);}
.chk-no{color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-border);}

/* 완료 노드 */
.tl-end{position:relative;}
.tl-end .tl-circle{width:32px;height:32px;left:-42px;margin-left:2px;}
.end-card{background:linear-gradient(135deg,#ecfdf5 0%,#d1fae5 100%);border:2px solid var(--green-border);border-radius:10px;padding:8px 16px;display:flex;align-items:center;gap:8px;}
.end-card svg{width:16px;height:16px;fill:var(--green-dark);}
.end-card span{font-size:13px;font-weight:700;color:var(--green-dark);}

/* CRM / 주의 */
.fc-extras{padding:0 20px 16px;display:flex;gap:10px;flex-wrap:wrap;}
.extra-box{flex:1;min-width:240px;border-radius:10px;padding:10px 14px;}
.extra-box.crm{background:var(--crm-bg);border:1px solid var(--crm-border);}
.extra-box.warn{background:var(--warn-bg);border:1px solid var(--warn-border);}
.extra-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;cursor:pointer;user-select:none;}
.extra-head .ex-icon{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.crm .ex-icon{background:var(--green);} .crm .ex-icon svg{width:10px;height:10px;fill:#fff;}
.warn .ex-icon{background:var(--amber);} .warn .ex-icon svg{width:10px;height:10px;fill:#fff;}
.extra-head .ex-title{font-size:11px;font-weight:700;letter-spacing:.3px;}
.crm .ex-title{color:var(--crm-text);} .warn .ex-title{color:var(--warn-text);}
.extra-head .ex-arrow{font-size:12px;margin-left:auto;}
.crm .ex-arrow{color:var(--crm-text);} .warn .ex-arrow{color:var(--warn-text);}
.ex-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.ex-body.open{max-height:300px;}
.ex-item{font-size:12px;line-height:1.5;padding:2px 0;}
.crm .ex-item{color:var(--crm-text);} .warn .ex-item{color:var(--warn-text);}

/* ───── 파라미터 사전 ───── */
.dict-cat{margin-bottom:12px;}
.dict-cat-title{font-size:14px;font-weight:800;color:var(--accent);padding:8px 4px 4px;border-bottom:2px solid var(--accent-light);margin-bottom:4px;}
.dict-card{background:var(--panel);border-radius:10px;border:1px solid var(--border);margin:4px 0;overflow:hidden;}
.dict-head{display:flex;align-items:center;padding:8px 14px;cursor:pointer;user-select:none;gap:8px;transition:background .12s;}
.dict-head:hover{background:var(--accent-light);}
.dict-head h4{font-size:13px;font-weight:700;flex:1;}
.dict-head .dict-desc{font-size:11px;color:var(--text2);margin-left:auto;max-width:50%;text-align:right;}
.dict-head .dict-arrow{font-size:12px;color:var(--text3);transition:transform .2s;flex-shrink:0;}
.dict-head .dict-arrow.open{transform:rotate(180deg);}
.dict-detail{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.dict-detail.open{max-height:500px;}
.dict-opts{padding:4px 14px 8px;}
.dict-opt{display:flex;padding:4px 0;gap:10px;border-bottom:1px solid var(--divider);}
.dict-opt:last-child{border-bottom:none;}
.dict-opt .do-name{min-width:180px;width:180px;font-size:12px;font-weight:600;color:var(--accent);flex-shrink:0;}
.dict-opt .do-desc{font-size:12px;color:var(--text2);line-height:1.4;}
</style>
</head>

<div class="app">
  <!-- 좌측 사이드바 -->
  <div class="sidebar">
    <div class="sidebar-head">
      <h2>
        <span class="logo"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></span>
        AOI Presetting Guide
        <span class="sel-badge" id="selCount" style="display:none"></span>
      </h2>
    </div>
    <div class="part-row">
      <label>부품 타입</label>
      <select class="part-select" id="partSelect"></select>
    </div>
    <div class="sym-scroll" id="symptomArea"></div>
    <div class="sidebar-foot">
      <button class="btn-clear" id="btnClear">전체 해제</button>
    </div>
  </div>

  <!-- 우측 메인 -->
  <div class="main-area">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="trouble">트러블슈팅</button>
      <button class="tab-btn" data-tab="dict">파라미터 사전</button>
      <span class="result-badge" id="resultCount"></span>
    </div>
    <div class="content" id="tabTrouble">
      <div id="resultArea">
        <div class="empty-state">
          <div class="empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#c0c0d0" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <p>좌측에서 <strong>증상을 선택</strong>하면<br>단계별 트러블슈팅 플로우가 표시됩니다</p>
        </div>
      </div>
    </div>
    <div class="content" id="tabDict" style="display:none;"></div>
  </div>
</div>

function onSel(){
  var sel=Object.entries(cbMap).filter(function(e){return e[1].checked;}).map(function(e){return e[0];});
  if(sel.length){selBadge.textContent=sel.length+'개';selBadge.style.display='';} else{selBadge.style.display='none';}
  showGuides(sel);
}

function showGuides(sel){
  resArea.innerHTML='';
  if(!sel.length){resBadge.textContent='';resArea.innerHTML='<div class="empty-state"><div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#c0c0d0" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div><p>좌측에서 <strong>증상을 선택</strong>하면<br>단계별 트러블슈팅 플로우가 표시됩니다</p></div>';return;}
  var m=G.filter(function(g){return sel.indexOf(g.sym)!==-1;});
  resBadge.textContent=m.length?m.length+'개 가이드':'';
  if(!m.length){resArea.innerHTML='<div class="empty-state"><p>선택한 증상에 해당하는 가이드가 없습니다</p></div>';return;}
  m.forEach(function(g){resArea.appendChild(buildFlow(g));});
}

  var stepTags=['우선 조정','추가 조정','심화 조정'];
  var h='';

  /* 헤더 — 증상명 + 원인 한줄 + 스텝 도트 */
  h+='<div class="fc-header">';
  h+='<div class="fc-icon">'+ICO_LAYERS+'</div>';
  h+='<div class="fc-title"><h3>'+esc(g.sym)+'</h3><div class="fc-cause">'+esc(g.cause)+'</div></div>';
  h+='<div class="fc-steps-count">';
  g.steps.forEach(function(_,i){h+='<div class="fc-step-dot d'+(i<3?stepColors[i]:'red')+'"></div>';});
  h+='</div></div>';

  /* 타임라인 바디 */
  h+='<div class="fc-body"><div class="timeline" style="--steps:'+g.steps.length+'">';

  g.steps.forEach(function(step,i){
    var col=stepColors[Math.min(i,2)];
    var scClass='sc-'+col;
    var cClass='c-'+col;

    /* 스텝 노드 */
    h+='<div class="tl-node">';
    h+='<div class="tl-circle '+cClass+'">'+(i+1)+'</div>';
    h+='<div class="step-card '+scClass+'" data-step="'+i+'">';
    h+='<div class="sc-head" onclick="toggleStep(this)">';
    h+='<span class="sc-badge">'+stepLabels[Math.min(i,2)]+'</span>';
    h+='<span class="sc-label">'+esc(step.label)+'</span>';
    h+='<span class="sc-count">'+step.items.length+'개 파라미터</span>';
    h+='<span class="sc-arrow">&#x25BC;</span>';
    h+='</div>';
    h+='<div class="sc-detail">';
    h+='<div class="sc-params">';
    step.items.forEach(function(item){
      h+='<div class="pm-row">';
      h+=dirIcon(item.dir);
      h+='<span class="pm-tag">'+esc(item.p)+'</span>';
      h+='<div class="pm-body"><div class="pm-action">'+esc(item.d)+'</div>';
      h+='<div class="pm-why">'+esc(item.w)+'</div></div></div>';
    });
    h+='</div></div></div></div>';

    /* 확인 포인트 */
    h+='<div class="tl-check">';
    h+='<div class="tl-circle c-green">'+ICO_CHECK+'</div>';
    h+='<div class="check-card">';
    h+='<div class="chk-icon">'+ICO_CHECK+'</div>';
    h+='<div class="chk-text">'+esc(step.verify)+'</div>';
    if(i<g.steps.length-1){
      h+='<div class="chk-branch"><span class="chk-yes">해결 &#x2192; 완료</span><span class="chk-no">미해결 &#x2192;</span></div>';
    }
    h+='</div></div>';
  });

  /* 완료 노드 */
  h+='<div class="tl-end">';
  h+='<div class="tl-circle c-green">'+ICO_CHECK+'</div>';
  h+='<div class="end-card">'+ICO_CHECK+'<span>트러블슈팅 완료</span></div>';
  h+='</div>';

  h+='</div></div>'; /* timeline, fc-body */

  /* CRM + 주의 */
  if((g.crm&&g.crm.length)||(g.warn&&g.warn.length)){
    h+='<div class="fc-extras">';
    if(g.crm&&g.crm.length){
      h+='<div class="extra-box crm"><div class="extra-head" onclick="toggleExtra(this)">';
      h+='<span class="ex-icon">'+ICO_CHECK+'</span><span class="ex-title">CRM 실적 ('+g.crm.length+')</span><span class="ex-arrow">&#x25BC;</span></div>';
      h+='<div class="ex-body">';
      g.crm.forEach(function(c){h+='<div class="ex-item">&#x2022; '+esc(c)+'</div>';});
      h+='</div></div>';
    }
    if(g.warn&&g.warn.length){
      h+='<div class="extra-box warn"><div class="extra-head" onclick="toggleExtra(this)">';
      h+='<span class="ex-icon"><svg viewBox="0 0 16 16"><path d="M8 1L1 14h14L8 1zm0 4v5m0 2v1"/></svg></span><span class="ex-title">주의사항 ('+g.warn.length+')</span><span class="ex-arrow">&#x25BC;</span></div>';
      h+='<div class="ex-body">';
      g.warn.forEach(function(w){h+='<div class="ex-item">&#x26A0; '+esc(w)+'</div>';});
      h+='</div></div>';
    }
    h+='</div>';
  }

  el.innerHTML=h;
  return el;
}

/* 토글 함수 */
function toggleStep(el){
  var detail=el.nextElementSibling;
  var arrow=el.querySelector('.sc-arrow');
  detail.classList.toggle('open');
  arrow.classList.toggle('open');
}
function toggleExtra(el){
  var body=el.nextElementSibling;
  var arrow=el.querySelector('.ex-arrow');
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

/* 파라미터 사전 */
function buildDict(){
  var h='';
  PARAM_GUIDE.forEach(function(cat){
    h+='<div class="dict-cat"><div class="dict-cat-title">'+esc(cat[0])+'</div>';
    cat[1].forEach(function(param){
      var desc=PGD[param[0]]||'';
      h+='<div class="dict-card"><div class="dict-head" onclick="toggleDict(this)">';
      h+='<h4>'+esc(param[0])+'</h4>';
      if(desc) h+='<span class="dict-desc">'+esc(desc)+'</span>';
      h+='<span class="dict-arrow">&#x25BC;</span></div>';
      h+='<div class="dict-detail"><div class="dict-opts">';
      param[1].forEach(function(opt){
        h+='<div class="dict-opt"><span class="do-name">'+esc(opt[0])+'</span><span class="do-desc">'+esc(opt[1])+'</span></div>';
      });
      h+='</div></div></div>';
    });
    h+='</div>';
  });
  tabD.innerHTML=h;
}
function toggleDict(el){
  var d=el.nextElementSibling;
  var a=el.querySelector('.dict-arrow');
  d.classList.toggle('open');
  a.classList.toggle('open');
}
buildDict();
</script>
</body>
</html>
